<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MarUnity LIVE Tex</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Inter,sans-serif}
body{min-height:100vh;background:#0A0E1F;display:flex;justify-content:center;color:white}
.container{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;padding-top:20vh;text-align:center}
.logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#4F46E5,#8B5CF6);display:grid;place-items:center;font-weight:800;font-size:32px;box-shadow:0 0 35px rgba(79,124,255,.4);margin-bottom:18px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:32px;font-weight:800;letter-spacing:2px}
.sub{color:#8B5CF6;font-size:12px;font-weight:700;letter-spacing:4px;margin-top:6px;display:block}
.hero{margin-top:20px}
.hero h2{font-size:20px;font-weight:800;line-height:1.3}
.hero p{margin-top:8px;font-size:13.5px;color:#9CA3AF;line-height:1.4}
.actions{width:100%;margin-top:32px}
.btn{width:100%;height:50px;border-radius:14px;border:none;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:12px;transition:opacity .2s}
.btn:active{opacity:.85}
.btn:disabled{opacity:.6;cursor:wait}
.btn-google{background:white;color:#111}
.btn-apple{background:#161C30;color:white;border:1px solid #232C4A}
#login-error{color:#f87171;font-size:13px;margin-top:14px;min-height:18px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app" class="container">
  <div class="logo">M</div>
  <h1>MarUnity</h1>
  <span class="sub">LIVE TEX</span>
  
  <div class="hero">
    <h2>Automatizá y dale voz a tu LIVE</h2>
    <p>Lectura de comentarios en tiempo real, efectos y control total de tu stream.</p>
  </div>
  
  <div class="actions">
    <button class="btn btn-google" id="btnG">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span id="btnG-text">Entrar con Google</span>
    </button>
    <button class="btn btn-apple" id="btnA">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.31c.65-.79 1.09-1.89.97-2.99-.94.04-2.08.63-2.75 1.42-.59.68-1.1 1.78-.96 2.85 1.05.08 2.12-.51 2.74-1.28z"/></svg>
      Entrar con Apple
    </button>
    <p id="login-error"></p>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://kaqytprpjqpptrjeerrt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_JwTyhcOihTtDmL6VtuK2SQ_b_WHriql';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const btnG = document.getElementById('btnG');
  const btnGText = document.getElementById('btnG-text');
  const errorEl = document.getElementById('login-error');

  // Si ya estas logueado, no te quedes en la puerta, anda a la app
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = 'index.html';
  }

  // Logo si existe
  const img = new Image();
  img.src = 'logo.png';
  img.onload = () => {
    document.querySelector('.logo').innerHTML = `<img src="logo.png" alt="MarUnity">`;
  };

  btnG.onclick = async () => {
    btnG.disabled = true;
    btnGText.textContent = 'Conectando...';
    errorEl.textContent = '';
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' }
    });
    if (error) {
      errorEl.textContent = 'Error: ' + error.message;
      btnG.disabled = false;
      btnGText.textContent = 'Entrar con Google';
    }
  };

  document.getElementById('btnA').onclick = () => alert('Apple próximamente');
</script>
</body>
</html>
